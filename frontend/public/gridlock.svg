<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- abstract road grid -->
  <g stroke="url(#road)" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <path d="M120 640 L420 360 L760 460 L1080 220"/>
    <path d="M120 360 L380 520 L720 300 L1080 520"/>
    <path d="M260 720 L520 220"/>
    <path d="M640 740 L880 200"/>
  </g>

  <!-- nodes / congestion points -->
  <g>
    <circle cx="420" cy="360" r="16" fill="#5eead4"/>
    <circle cx="760" cy="460" r="20" fill="#f472b6"/>
    <circle cx="380" cy="520" r="14" fill="#fbbf24"/>
    <circle cx="720" cy="300" r="16" fill="#a78bfa"/>
    <circle cx="1080" cy="220" r="14" fill="#5eead4"/>
  </g>

  <!-- label chip -->
  <g>
    <rect x="100" y="96" width="190" height="50" rx="25" fill="#ffffff" fill-opacity="0.14"/>
    <circle cx="132" cy="121" r="8" fill="#5eead4"/>
    <text x="156" y="128" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">Python · ML</text>
  </g>

</svg>
